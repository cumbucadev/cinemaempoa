name: Remote SSH Command

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy-cinemaempoa:
    if: ${{ github.repository == 'cumbucadev/cinemaempoa' }}
    name: Deploy Cinema Em POA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: checkout
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -euo pipefail

            cd cinemaempoa
            git pull

            echo "🧹 Pruning stale images before build..."
            docker image prune -af
            echo "✅ Pre-build cleanup complete."

            echo "🔄 Building Docker image..."
            docker compose -f docker-compose.shared.yml build flask

            echo "🔄 Running database migrations..."
            docker compose -f docker-compose.shared.yml run --rm flask flask --app flask_backend db-upgrade
            echo "✅ Migrations completed."

            echo "🚀 Starting application..."
            docker compose -f docker-compose.shared.yml up -d flask

            echo "📊 Disk usage before cleanup:"
            docker system df
            df -h /

            echo "🧹 Reclaiming disk space (containers, networks, images, build cache)..."
            docker system prune -af
            echo "✅ Cleanup complete."

            echo "📊 Disk usage after cleanup:"
            docker system df
            df -h /

            echo "🎉 Docker cleanup complete!"

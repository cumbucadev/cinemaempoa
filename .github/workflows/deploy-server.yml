name: Remote SSH Command

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy-cinemaempoa:
    if: ${{ github.repository == 'cumbucadev/cinemaempoa' }}
    name: Deploy Cinema Em POA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: checkout
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -euo pipefail

            cd cinemaempoa
            git pull

            echo "🧹 Pruning stale images before build..."
            docker image prune -af
            echo "✅ Pre-build cleanup complete."

            echo "🔄 Building Docker image..."
            docker compose -f docker-compose.shared.yml build flask cinemaempoa_mcp

            echo "🔄 Running database migrations..."
            docker compose -f docker-compose.shared.yml run --rm flask flask --app flask_backend db-upgrade
            echo "✅ Migrations completed."

            echo "🚀 Starting application..."
            docker compose -f docker-compose.shared.yml up -d flask cinemaempoa_mcp

            # The MCP server refuses to start without ORBIT_MCP_TOKEN in .env;
            # fail the deploy loudly instead of leaving it in a restart loop.
            # An unauthenticated request must get 401 once it is serving.
            echo "🔎 Checking the MCP server answers..."
            mcp_up=0
            for attempt in 1 2 3 4 5 6; do
              sleep 5
              if docker compose -f docker-compose.shared.yml exec -T cinemaempoa_mcp \
                python -c "import urllib.request as u, urllib.error as e
            try: u.urlopen(u.Request('http://127.0.0.1:8001/mcp', method='POST'))
            except e.HTTPError as err: raise SystemExit(err.code != 401)
            raise SystemExit(1)" 2>/dev/null; then
                mcp_up=1
                break
              fi
            done
            if [ "$mcp_up" != 1 ]; then
              docker compose -f docker-compose.shared.yml logs --tail 50 cinemaempoa_mcp
              echo "❌ cinemaempoa_mcp is not answering (is ORBIT_MCP_TOKEN set in .env?)"
              exit 1
            fi
            echo "✅ MCP server answering."

            # nginx/default.conf is a single-file bind mount, so the container
            # only sees the version `git pull` just wrote once it is recreated.
            echo "🔄 Recreating nginx..."
            docker compose -f docker-compose.shared.yml up -d --force-recreate nginx

            # Fail the deploy if the public site does not answer through nginx.
            echo "🔎 Checking the site answers..."
            site_up=0
            for attempt in 1 2 3 4 5 6; do
              sleep 5
              if curl -fsS -o /dev/null https://cinemaempoa.com.br/; then
                site_up=1
                break
              fi
            done
            if [ "$site_up" != 1 ]; then
              docker compose -f docker-compose.shared.yml logs --tail 50 nginx flask
              echo "❌ https://cinemaempoa.com.br/ is not answering"
              exit 1
            fi
            echo "✅ Site answering."

            echo "📊 Disk usage before cleanup:"
            docker system df
            df -h /

            echo "🧹 Reclaiming disk space (containers, networks, images, build cache)..."
            docker system prune -af
            echo "✅ Cleanup complete."

            echo "📊 Disk usage after cleanup:"
            docker system df
            df -h /

            echo "🎉 Docker cleanup complete!"
